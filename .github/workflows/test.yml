name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash:
    name: Bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS proves bash 3.2 compatibility
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi
      - name: Ensure PowerShell is available (needed by the parity suite)
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install --cask powershell
            else
              sudo apt-get install -y powershell || {
                # Fallback: install from Microsoft package repo if not in default apt
                wget -q "https://github.com/PowerShell/PowerShell/releases/latest/download/powershell-lts_amd64.deb" -O /tmp/pwsh.deb || true
                sudo dpkg -i /tmp/pwsh.deb || sudo apt-get install -f -y
              }
            fi
          fi
          pwsh --version
      - name: Run load-config Bats suite
        run: bats tests/bash/load-config.bats
      - name: Run cross-platform parity suite
        run: bats tests/parity/parity.bats

  powershell:
    name: Pester (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
      - name: Run load-config Pester suite
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests/powershell/load-config.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.TestDrive.Enabled = $false
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
