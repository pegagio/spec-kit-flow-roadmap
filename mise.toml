[tools]
python = "3.11.16"
uv = "0.12.5"
"pipx:specify-cli" = { version = "1.0.10.dev0+pegagio.2", depends = ["python", "uv"] }

[settings.task]
run_auto_install = false

[tasks.test]
description = "Run the complete Python contract suite"
run = "python -m unittest discover -s tests/python -p 'test_*.py'"
